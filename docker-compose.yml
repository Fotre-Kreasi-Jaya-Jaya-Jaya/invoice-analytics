services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/invoice_analytics
      - NINEROUTER_BASE_URL=${NINEROUTER_BASE_URL}
      - NINEROUTER_API_KEY=${NINEROUTER_API_KEY}
      - NINEROUTER_MODEL=${NINEROUTER_MODEL:-high-availability-copy}
      - JWT_SECRET=${JWT_SECRET}
      - EPHEMERAL_TTL_HOURS=${EPHEMERAL_TTL_HOURS:-24}
    volumes:
      - storage_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoice_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/migrations:/docker-entrypoint-initdb.d  # optional for pre-seeded DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  storage_data:
